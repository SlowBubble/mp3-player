<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#667eea">
    <title>MP3 Playlist Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }



        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        #player-page.active {
            display: flex;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 15px 25px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 15px;
            backdrop-filter: blur(10px);
        }

        .btn:hover,
        .btn:active {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .file-input {
            display: none;
        }

        .playlist {
            margin-top: 20px;
        }

        .track-wrapper {
            display: flex;
            align-items: stretch;
            gap: 10px;
            margin-bottom: 12px;
        }

        .track-item {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            overflow: hidden;
            min-width: 0;
        }

        .track-item:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-2px);
        }

        .track-item--active {
            background: rgba(74, 222, 128, 0.25);
            border: 1px solid rgba(74, 222, 128, 0.5);
        }

        .track-item--active:hover {
            background: rgba(74, 222, 128, 0.35);
        }

        .track-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 4px 0 16px;
            font-size: 12px;
            opacity: 0.5;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .track-divider::before,
        .track-divider::after {
            content: '';
            flex: 1;
            height: 2px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 1px;
        }

        .track-name {
            font-weight: 600;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-duration {
            font-size: 14px;
            opacity: 0.8;
        }

        .track-stats {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 3px;
        }

        .remove-track-btn {
            width: 50px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            opacity: 0.6;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }

        .remove-track-btn:hover {
            background: rgba(255, 0, 0, 0.4);
            opacity: 1;
        }

        .restore-track-btn:hover {
            background: rgba(74, 222, 128, 0.4) !important;
            opacity: 1;
        }

        .track-progress {
            margin-top: 8px;
        }

        .track-progress-bar {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            overflow: hidden;
        }

        .track-progress-fill {
            height: 100%;
            background: #4ade80;
            width: 0%;
            transition: width 0.3s ease;
        }

        .player-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            backdrop-filter: blur(20px);
        }

        .now-playing {
            text-align: center;
            margin-bottom: 20px;
        }

        .track-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .progress-container {
            margin: 0 0 5px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            overflow: hidden;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            background: white;
            width: 0%;
            transition: width 0.1s ease;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-top: 5px;
            opacity: 0.8;
        }

        .control-buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            margin-bottom: 0;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            flex: 1;
            height: 60px;
            border-radius: 0;
            font-size: 22px;
            cursor: pointer;
            transition: background 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:last-child {
            border-right: none;
        }

        .control-btn.play-pause {
            font-size: 28px;
        }

        .control-btn:hover,
        .control-btn:active {
            background: rgba(255, 255, 255, 0.28);
        }

        .control-btn.small {
            font-size: 16px;
        }

        .secondary-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 0;
            margin-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .secondary-controls .control-btn {
            height: 52px;
            font-size: 16px;
        }

        .home-btn-bar {
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 25px;
        }

        .back-btn-bar {
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .control-btn.play-pause {
            flex: 3;
            font-size: 32px;
        }

        .control-btn.icon-xs { font-size: 14px; }
        .control-btn.icon-sm { font-size: 20px; }
        .control-btn.icon-lg { font-size: 28px; }

        .hide-and-next-btn {
            flex: 0 0 60px;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            height: 60px;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }

        .hide-and-next-btn:active {
            background: rgba(255, 0, 0, 0.3);
        }

        /* Adjust player page to not be hidden by fixed header */
        #player-page {
            padding-top: 0;
            flex-direction: column;
            justify-content: space-between;
            height: calc(100vh - 280px);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
            transition: background 0.8s ease;
        }

        body.player-active {
            background: linear-gradient(135deg, #7f1d1d 0%, #450a0a 100%);
        }

        body.playing {
            background: linear-gradient(135deg, #064e3b 0%, #022c22 100%);
        }
        .empty-state {
            text-align: center;
            margin-top: 50px;
            opacity: 0.8;
        }

        .select-folder-container {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .select-folder-container .btn {
            margin-bottom: 0;
        }

        .btn-sort {
            flex: 0 0 auto;
            width: auto;
            padding: 15px 18px;
            font-size: 14px;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Home Page -->
        <div id="home-page" class="page active">
            <input type="file" id="file-input" class="file-input" webkitdirectory multiple accept="audio/mp3">
            
            <div id="select-folder-container" class="select-folder-container">
                <button class="btn" onclick="document.getElementById('file-input').click()">
                    📁 Select Music Folder
                </button>
                <p style="text-align:center; opacity:0.5; font-size:12px; margin:8px 0 0;">v2026-09-27n</p>
            </div>            <div id="post-load-controls" style="display:none;">
                <div style="display:flex; gap:10px;">
                    <button class="btn btn-sort" style="flex:1;" onclick="location.reload()" title="Refresh app">🔄 Refresh</button>
                    <button id="sort-btn" class="btn btn-sort" style="flex:1;" onclick="cycleSortMode()" title="Cycle sort order">Sort (Small)</button>
                </div>
            </div>

            <div id="playlist" class="playlist"></div>

        </div>

        <!-- Player Page -->
        <div id="player-page" class="page" onclick="togglePlayPause()" style="cursor: pointer;">
            <div class="track-title" id="current-track-title" style="text-align: center; padding: 20px 20px 0;">Select a track</div>
            <audio id="audio-player" preload="metadata"></audio>
        </div>
    </div>

    <!-- Player Controls (shown on player page) -->
    <div id="player-controls" class="player-controls" style="display: none;">
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="time-display">
                <span id="current-time">0:00</span>
                <span id="total-time">0:00</span>
            </div>
        </div>

        <div class="back-btn-bar">
            <button class="control-btn small" id="playback-rate-btn" onclick="togglePlaybackRate()" title="Playback Speed">1x</button>
            <button class="control-btn icon-sm" style="flex: 2;" onclick="showHomePage()" title="Back to playlist">🏠</button>
            <button class="hide-and-next-btn" onclick="hideCurrentAndPlayNext()" title="Hide track">✕</button>
        </div>

        <div class="now-playing">
        </div>

        <div class="home-btn-bar">
            <button class="control-btn icon-lg" onclick="prevChapter()" title="Previous Chapter">⏮️</button>
            <button class="control-btn play-pause" id="play-pause-btn" onclick="togglePlayPause()" title="Play/Pause">▶️</button>
            <button class="control-btn icon-lg" onclick="nextChapter()" title="Next Chapter">⏭️</button>
        </div>

        <div class="control-buttons">
            <button class="control-btn icon-sm" onclick="rewind45()" title="Rewind 45s">⏪</button>
            <button class="control-btn icon-xs" onclick="rewind7()" title="Rewind 7s">⏪</button>
            <button class="control-btn icon-xs" onclick="forward7()" title="Forward 7s">⏩</button>
            <button class="control-btn icon-sm" onclick="forward45()" title="Forward 45s">⏩</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>

</html>
